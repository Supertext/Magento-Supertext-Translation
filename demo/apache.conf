<VirtualHost *:80>
    DocumentRoot /var/www/magento/pub
    <Directory /var/www/magento/pub>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    # Railway terminates TLS; Magento reads X-Forwarded-Proto (web/secure/offloader_header).
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
